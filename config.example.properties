# Free My TV settings. build.sh copies this file to config.properties the first time; edit that one and rebuild.

# Free key from https://www.themoviedb.org/settings/api (the "API Read Access Token" or the "API Key").
# Without it, the home screen still works, just without the trending picks.
tmdb_key=

# Your country (two letters): decides which titles are on which streaming app. US, GB, CA, BR, DE, FR...
tmdb_region=US

# Your city, for the weather and the sunset that turns the home screen dark at night (decimal degrees).
latitude=40.7128
longitude=-74.0060
# Optional: the name shown on the weather card (empty = "Weather").
city=

# auto (follows the TV), en, es, pt, ru, or de (on Google TV)
language=auto

# true shows cryptocurrency prices from Binance on the home screen and screensaver.
show_crypto=true

# Crypto prices: USD, BRL, EUR... (used only when show_crypto=true)
currency=USD

# C, F, or auto (Fahrenheit when the TV is set to the US)
temperature=auto

# true also turns off Google Assistant ("Ok Google"); the remote's mic button stops working
disable_assistant=false

# Optional: free key from https://kinopoiskapiunofficial.tech (Profile > API key): Kinopoisk and IMDb ratings on the
# picks. Without it the picks show TMDB's rating.
kinopoisk_key=

# Optional: titles you love, separated by ";" (e.g. Interstellar; Breaking Bad). The picks start from what TMDB
# recommends for them; holding OK on a pick on the TV adds it too.
favorites=

# Optional: "Now playing" from Spotify on any device. Create an app at https://developer.spotify.com/dashboard with
# the redirect URI http://127.0.0.1:8888/callback, put its Client ID and Client Secret here, then run
# python3 tools/spotify_token.py once: it fills in spotify_refresh_token.
spotify_client_id=
spotify_client_secret=
spotify_refresh_token=

# Optional: YouTube on its tile (the newest videos from your subscriptions). In Google Cloud: a project with the
# YouTube Data API v3 enabled and an OAuth client of type "TVs and Limited Input devices"; put its ID and secret here,
# then run python3 tools/youtube_token.py once: it fills in youtube_refresh_token.
youtube_client_id=
youtube_client_secret=
youtube_refresh_token=

# Optional: KINO.WATCH (kino.pub) picks: python3 tools/kinopub_token.py fills it in.
kinopub_refresh_token=

# Optional: the voice assistant (the remote's mic button). whisper_url is a whisper.cpp server on your computer, e.g.
# http://192.168.0.183:8178/inference (tools/whisper_server.sh starts one); anthropic_key is yours, from
# console.anthropic.com. Switch it on with tools/voice_on.sh (it takes over the mic button from Google Assistant).
whisper_url=
anthropic_key=
assistant_model=claude-sonnet-5-5

# Which brain answers: "openai" (ChatGPT; openai_key from platform.openai.com) or "anthropic" (Claude; anthropic_key).
assistant_provider=anthropic
openai_key=
openai_model=gpt-4o

# The assistant's voice (OpenAI text-to-speech): alloy, ash, ballad, coral, echo, fable, nova, onyx, sage, shimmer, verse.
openai_voice=coral
openai_tts_model=gpt-4o-mini-tts
# "live" (with openai_key): a live conversation through OpenAI's Realtime API, as in ChatGPT's voice mode; you can
# interrupt it, and no whisper_url is needed. "turns": whisper_url hears you, then openai_model or Claude answers.
# The mic button starts the conversation and a second press ends it. Live voices: marin, cedar, alloy, ash, ballad,
# coral, echo, sage, shimmer, verse.
voice_mode=live
openai_realtime_model=gpt-realtime-2.1
openai_realtime_voice=marin
# How fast it speaks: 1 is normal, 0.25 to 1.5.
openai_voice_speed=1.2
# true lets Chrome's DevTools (chrome://inspect, over adb) look into the Reels screen. For fixing it only.
debug_webview=false
# On a TV without echo cancelling the assistant may hear itself and stop mid-sentence: true mutes the mic while it
# speaks (then you can't interrupt it).
live_mute_while_speaking=false
